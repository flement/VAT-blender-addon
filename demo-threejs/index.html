<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VAT demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <button id="panel-toggle" type="button" aria-label="Toggle panel"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 5h16" /><path d="M4 12h16" /><path d="M4 19h16" /></svg></button>
    <aside id="panel">
      <div id="panel-resize" title="Resize panel"></div>
           <section>
        <h2>01 / ASSETS</h2>
        <label class="row"><span>EXAMPLE</span><select id="example-select"></select></label>
        <div class="slot" data-slot="mesh" role="button" tabindex="0">
          <span class="slot-name">01 — MESH [.GLB]</span>
          <span class="slot-file" data-slot-label="mesh">vat_test.glb</span>
          <input type="file" accept=".glb,.gltf" hidden />
        </div>
        <div class="slot" data-slot="positions" role="button" tabindex="0">
          <span class="slot-name">02 — POSITIONS [.EXR/.PNG]</span>
          <span class="slot-file" data-slot-label="positions">positions.exr</span>
          <input type="file" accept=".exr,.png" hidden />
        </div>
        <div class="slot" data-slot="normals" role="button" tabindex="0">
          <span class="slot-name">03 — NORMALS [.PNG, OPT.]</span>
          <span class="slot-file" data-slot-label="normals">normals.png</span>
          <input type="file" accept=".png" hidden />
        </div>
        <div class="slot" data-slot="storage" role="button" tabindex="0">
          <span class="slot-name">04 — VAT BIN [.BIN]</span>
          <span class="slot-file" data-slot-label="storage">—</span>
          <input type="file" accept=".bin" hidden />
        </div>
        <div class="slot" data-slot="storageMeta" role="button" tabindex="0">
          <span class="slot-name">05 — VAT META [.JSON]</span>
          <span class="slot-file" data-slot-label="storageMeta">—</span>
          <input type="file" accept=".json" hidden />
        </div>
        <pre id="status">Loading…</pre>
      </section>

      <section>
        <h2>02 / BAKE</h2>
        <label class="row"><span>SOURCE</span>
          <select data-param="backend">
            <option value="texture" selected>vat texture</option>
            <option value="storage">storage buffer</option>
          </select>
        </label>
        <label class="row" data-backends="texture"><span>WRAP</span>
          <select data-param="wrapMode">
            <option value="none">none</option>
            <option value="wrap">wrap</option>
            <option value="wrap_crop" selected>wrap_crop</option>
          </select>
        </label>
        <label class="row" data-backends="texture"><span>FRAMES</span><input type="number" data-param="frames" min="1" max="1024" step="1" /></label>
        <label class="row"><span>MODE</span>
          <select data-param="positionMode">
            <option selected>offsets</option><option>absolutes</option>
          </select>
        </label>
        <label class="row check"><span>NORMALIZE&gt;PNG</span><input type="checkbox" data-param="normalize" /></label>
        <label class="row"><span>MIN_OFF</span><input type="number" data-param="minOffset" step="any" /></label>
        <label class="row"><span>MAX_OFF</span><input type="number" data-param="maxOffset" step="any" /></label>
        <label class="row" data-backends="texture"><span>TEX_FILTER</span>
          <select data-param="texFilter">
            <option value="nearest" selected>nearest (crisp)</option>
            <option value="linear">linear (smooth)</option>
          </select>
        </label>
      </section>

      <section>
        <h2>03 / PLAYBACK</h2>
        <label class="row"><span>FPS</span><input type="number" data-param="fps" min="1" max="120" step="1" /></label>
        <label class="row" data-backends="storage" title="Export stride — playback fps recalculated as FPS/STEP"><span>STEP</span><input type="number" data-param="step" min="1" max="60" step="1" /></label>
        <label class="row check" data-backends="storage" title="Lerp between sampled rows (textures use TEX_FILTER)"><span>SMOOTH</span><input type="checkbox" data-param="smooth" checked /></label>
        <div class="btn-row">
          <button id="btn-frame-mesh" type="button">FRAME_MESH</button>
          <button id="btn-reload" type="button">RELOAD</button>
        </div>
      </section>
      <div class="foot">
        <a href="https://github.com/flanb/VAT-blender-plugin/issues/new" target="_blank" rel="noopener" class="issue-link" title="Report an issue">Need help?</a>
      </div>
    </aside>
    <button id="texpreview-toggle" type="button" aria-label="Toggle textures"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect width="18" height="18" x="3" y="3" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg></button>
    <footer id="timeline" aria-label="Playback timeline">
      <button id="btn-play" type="button" title="Play / pause [space]"><span data-icon="pause"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><rect x="14" y="3" width="5" height="18" /><rect x="5" y="3" width="5" height="18" /></svg></span><span data-icon="play" hidden><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" /></svg></span></button>
      <button id="btn-prev" type="button" title="Previous frame"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z" /><path d="M3 20V4" /></svg></button>
      <button id="btn-next" type="button" title="Next frame"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M21 4v16" /><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z" /></svg></button>
      <button id="btn-reverse" type="button" title="Reverse"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="m16 3 4 4-4 4" /><path d="M20 7H4" /><path d="m8 21-4-4 4-4" /><path d="M4 17h16" /></svg></button>
      <input id="time-slider" type="range" data-param="time" min="0" step="0.001" aria-label="Time" />
      <output id="frame-readout" title="Current / total frames">0 / 0</output>
      <output id="time-readout" title="Current / total seconds">0.00s</output>
    </footer>
    <div id="texpreview">
      <div id="texpreview-resize" title="Resize preview"></div>
      <div class="prev-label">POSITIONS <span id="preview-pos-dims"></span></div>
      <canvas id="preview-pos"></canvas>
      <div class="prev-label">NORMALS <span id="preview-nrm-dims"></span></div>
      <canvas id="preview-nrm"></canvas>
      <pre id="preview-status">–</pre>
    </div>
    <div id="overlay" class="overlay">
      <div id="overlay-text" class="overlay-card">Loading VAT assets…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
